# Логи всех сервисов ротируются: до 5 файлов по 10 МБ на контейнер.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-switch_trading}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-switch} -d ${POSTGRES_DB:-switch_trading}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  app:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Пороги и веса читаются с хоста: правка config/thresholds.yaml (с новым
      # номером version) + `docker compose restart app bot` — без пересборки образа.
      - ./config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # /ready: HTTP 503, если PostgreSQL не отвечает (/health — только liveness)
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "-m", "app.bot.bot"]
    volumes:
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # heartbeat обновляется раз в минуту при успешном ответе Telegram API
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; f='/tmp/bot-heartbeat'; sys.exit(0 if os.path.exists(f) and time.time() - os.path.getmtime(f) < 180 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
