# Веса Score, пороги Risk Filter и Rule Engine — версия v1 (ТЗ разделы 8–10).
# Этот файл — источник значений для formula_versions (is_active). Изменение
# порогов/весов = новая версия формул, не требует деплоя кода (КП с. 7, 9).
version: "v1.5.2"
# ВАЖНО: любое изменение чисел ниже требует нового номера версии. Сервисы
# отказываются запускаться, если в БД уже есть эта версия с другими параметрами.

# ---- Final Score: веса групп (зафиксированы КП, с. 7). Сумма = 1.0 ----
final_score_weights:
  momentum: 0.20
  growth: 0.15
  fundamentals: 0.15
  relative_strength: 0.15
  volume: 0.10
  valuation: 0.10
  catalysts: 0.15

# ---- Параметры нормализации факторных Score (v1, конфигурируемо; ТЗ 8) ----
# Формулы внутри factor scores эвристические — открытый вопрос для тюнинга после
# запуска (ТЗ раздел 16). Все множители/пороги вынесены сюда.
factor_scores:
  momentum:
    weight_rsi: 0.30
    weight_macd: 0.30
    weight_ema_structure: 0.40
    rsi_sweet_spot: [60, 70]     # зона «здорового» импульса → 100
    rsi_overbought: 80           # >= порога — усиленный штраф за перекупленность
    macd_hist_multiplier: 50.0   # чувствительность к гистограмме (норм. по цене)
  growth:
    revenue_growth_multiplier: 2.0
    eps_growth_multiplier: 1.5
  fundamentals:
    eps_positive_score: 70.0     # балл при EPS > 0
    eps_negative_score: 30.0     # балл при EPS <= 0
    debt_equity_penalty: 50.0    # штраф на единицу Debt/Equity (обратная шкала)
    negative_equity_de_score: 0.0  # D/E < 0 (отрицательный капитал) — худший балл (v1.5)
  relative_strength:
    rel_strength_multiplier: 5.0
    align_by_date: true          # доходности тикера и SPY — на общих датах (v1.5)
  volume:
    ratio_multiplier: 50.0
  valuation:
    pe_fair_low: 10.0            # P/E <= low → 100 (дёшево)
    pe_fair_high: 40.0           # P/E >= high → 0 (дорого)
    pe_negative_score: 25.0      # отрицательный P/E (нет прибыли) → низкий балл
    prefer_ttm_pe: true          # forward P/E → P/E TTM → годовой P/E (v1.5)
  catalysts:
    # score = clamp(50 + signal·multiplier), signal ∈ [-1, 1] — взвешенное среднее
    # тональности новостей (news_weight) и оценки событий SEC (sec_weight).
    sentiment_multiplier: 50.0
    news_weight: 1.0
    news_lookback_days: 14          # новости старше — не влияют; будущие и без даты — отбрасываются;
                                    # вес новости = 1 − возраст/окно (свежая весит больше)
    sec_weight: 2.0                 # официальный источник приоритетнее СМИ (ТЗ 4.2)
    sec_event_lookback_days: 30     # 8-K / NT старше — не влияют; вес = 1 − возраст/окно
    sec_report_lookback_days: 100   # 10-K/10-Q в окне = свежая подтверждённая отчётность
    # Пункты 8-K (классификация SEC Form 8-K):
    # 1.01 существенное соглашение, 2.01 завершение сделки M&A
    positive_8k_items: ["1.01", "2.01"]
    positive_8k_score: 0.5          # позитивные пункты неоднозначны — половинный вес
    negative_8k_score: -1.0
    # 1.02 расторжение соглашения, 1.03 банкротство, 2.04 ускорение обязательств,
    # 2.05 реструктуризация, 2.06 обесценение, 3.01 угроза делистинга,
    # 4.01 смена аудитора, 4.02 недостоверность ранее опубликованной отчётности
    negative_8k_items: ["1.02", "1.03", "2.04", "2.05", "2.06", "3.01", "4.01", "4.02"]
    # Уведомление о просрочке отчётности
    negative_forms: ["NT 10-K", "NT 10-Q"]

# ---- Неполнота данных: два уровня (ТЗ раздел 8: «снижает confidence либо не
# формирует сигнал»). Критично → Final Score не выдаётся; некритично → Score
# с пониженной достоверностью; в обоих случаях флаг missing_data с причинами.
data_quality:
  min_history_bars_critical: 200     # < 200 баров: EMA200 не рассчитать → критично
  min_history_bars_full: 250         # 200–249 баров → пониженная достоверность
  fundamentals_missing_critical: 3   # нет ≥3 из 6 ключевых fundamentals → критично
  max_last_bar_age_business_days: 3  # последний бар старше 3 раб. дней → критично (v1.5)
  check_actively_trading: true       # профиль: бумага не торгуется → критично (v1.5)

# ---- Risk Filter: пороги флагов (v1; ТЗ раздел 9) ----
risk_filter:
  high_volatility_atr_ratio: 0.05        # ATR/close > 5%
  event_risk_days: 3                     # earnings в ближайшие <= N раб. дней (будни пн–пт,
                                         # без учёта биржевых праздников)
  gap_risk_pct: 5.0                       # |Gap%| > 5%
  overextension_ema20_pct: 15.0          # Distance to EMA20 > 15%
  overextension_below_ema20_pct: 15.0    # Distance to EMA20 < −15% (v1.5)
  liquidity_min_avg_volume: 500000       # средний объём 20д
  news_risk_sentiment: -0.3              # news_sentiment < -0.3 (Этап 2)

# ---- Rule Engine: пороги статуса по Final Score (v1; ТЗ раздел 10) ----
rule_engine:
  buy_min_score: 75
  buy_confirm_momentum: 60
  buy_confirm_volume: 50
  buy_on_dip_distance_ema20_pct: 10.0
  watch_min_score: 50
